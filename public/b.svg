<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="100%" height="100%" shape-rendering="crispEdges">
  
  <!-- Fundo / Contorno Preto (Base da Moeda) -->
  <g fill="#1e1e1e">
    <rect x="8" y="0" width="10" height="26"/>
    <rect x="6" y="1" width="14" height="24"/>
    <rect x="4" y="2" width="18" height="22"/>
    <rect x="3" y="3" width="20" height="20"/>
    <rect x="2" y="4" width="22" height="18"/>
    <rect x="1" y="6" width="24" height="14"/>
    <rect x="0" y="8" width="26" height="10"/>
  </g>

  <!-- Ouro Base (Preenchimento Interno) -->
  <g fill="#eeb038">
    <rect x="8" y="1" width="10" height="24"/>
    <rect x="6" y="2" width="14" height="22"/>
    <rect x="4" y="3" width="18" height="20"/>
    <rect x="3" y="4" width="20" height="18"/>
    <rect x="2" y="6" width="22" height="14"/>
    <rect x="1" y="8" width="24" height="10"/>
  </g>

  <!-- Brilho / Reflexo da Moeda (Topo e Esquerda) -->
  <g fill="#fce06d">
    <rect x="8" y="1" width="10" height="1"/>
    <rect x="6" y="2" width="14" height="1"/>
    <rect x="4" y="3" width="4" height="1"/>
    <rect x="3" y="4" width="3" height="2"/>
    <rect x="2" y="6" width="2" height="2"/>
    <rect x="1" y="8" width="2" height="10"/>
    <rect x="2" y="18" width="2" height="2"/>
    <rect x="3" y="20" width="2" height="2"/>
    <rect x="4" y="22" width="4" height="1"/>
  </g>

  <!-- Sombra da Moeda (Base e Direita) -->
  <g fill="#c97a22">
    <rect x="18" y="3" width="4" height="1"/>
    <rect x="20" y="4" width="3" height="2"/>
    <rect x="22" y="6" width="2" height="2"/>
    <rect x="23" y="8" width="2" height="10"/>
    <rect x="22" y="18" width="2" height="2"/>
    <rect x="21" y="20" width="2" height="2"/>
    <rect x="18" y="22" width="4" height="1"/>
    <rect x="6" y="23" width="14" height="1"/>
    <rect x="8" y="24" width="10" height="1"/>
  </g>

  <!-- Sombra 3D do "W" -->
  <g fill="#5c310c">
    <rect x="7" y="9" width="2" height="5"/>
    <rect x="17" y="9" width="2" height="5"/>
    <rect x="12" y="13" width="2" height="2"/>
    <rect x="8" y="14" width="2" height="1"/>
    <rect x="16" y="14" width="2" height="1"/>
    <rect x="9" y="15" width="3" height="1"/>
    <rect x="14" y="15" width="3" height="1"/>
    <rect x="10" y="16" width="2" height="1"/>
    <rect x="14" y="16" width="2" height="1"/>
  </g>

  <!-- O "W" Principal -->
  <g fill="#8a4c16">
    <rect x="7" y="8" width="2" height="5"/>
    <rect x="17" y="8" width="2" height="5"/>
    <rect x="12" y="12" width="2" height="2"/>
    <rect x="8" y="13" width="2" height="1"/>
    <rect x="16" y="13" width="2" height="1"/>
    <rect x="9" y="14" width="3" height="1"/>
    <rect x="14" y="14" width="3" height="1"/>
    <rect x="10" y="15" width="2" height="1"/>
    <rect x="14" y="15" width="2" height="1"/>
  </g>
</svg>
