<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64">
  <!-- Borda Externa Recortada (Dourado Escuro) -->
  <circle cx="8" cy="8" r="7.5" fill="none" stroke="#A87F00" stroke-width="1" stroke-dasharray="2 1"/>
  
  <!-- Corpo da Ficha (Dourado Base) -->
  <circle cx="8" cy="8" r="7" fill="#FFD700" stroke="#C59B00" stroke-width="1"/>
  
  <!-- Brilho Superior/Anel Interno (Dourado Claro) -->
  <circle cx="8" cy="8" r="5.5" fill="none" stroke="#FFF0A0" stroke-width="0.75" opacity="0.8"/>

  <!-- Monograma WS Pixel Art (Marrom Metálico) -->
  <g fill="#604000">
    <!-- W -->
    <rect x="3" y="6" width="1" height="4"/>
    <rect x="4" y="9" width="1" height="1"/>
    <rect x="5" y="8" width="1" height="1"/>
    <rect x="6" y="9" width="1" height="1"/>
    <rect x="7" y="6" width="1" height="4"/>
    
    <!-- S -->
    <rect x="9" y="6" width="4" height="1"/>
    <rect x="9" y="7" width="1" height="1"/>
    <rect x="9" y="8" width="4" height="1"/>
    <rect x="12" y="9" width="1" height="1"/>
    <rect x="9" y="10" width="4" height="1"/>
  </g>
</svg>
